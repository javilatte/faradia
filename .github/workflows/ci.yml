name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # faradia runs on Linux and macOS: every suite runs on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (bats)
        run: npm run test:bats
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  # Dictation on macOS uses a small Swift helper (server/voice/apple/transcribe.swift). It is compiled
  # here so a change that breaks it fails the PR; publish.yml builds the one that goes to npm.
  apple-voice:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the speech recognition helper
        run: scripts/build-apple-voice.sh "$RUNNER_TEMP/Faradia.app"
      - name: Check the app
        run: |
          app="$RUNNER_TEMP/Faradia.app"
          bin="$app/Contents/MacOS/faradia-transcribe"
          archs="$(lipo -archs "$bin")"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::not universal: $archs"; exit 1; }
          codesign --verify --deep --strict "$app"
          # macOS kills a program that asks for speech recognition without saying why.
          plutil -extract NSSpeechRecognitionUsageDescription raw "$app/Contents/Info.plist"
          # It runs and answers in JSON (no recording, so no permission dialog).
          out="$("$bin" || true)"
          echo "$out"
          echo "$out" | grep -q '"ok":false'
      - name: Open the app the way Faradia does and get an answer
        run: |
          say -o "$RUNNER_TEMP/test.wav" --data-format=LEI16@16000 "This is a dictation test"
          # At most 3 minutes: the helper gives up on an unanswered permission dialog after 2.
          perl -e 'alarm 180; exec @ARGV' open -W -n -g --stdout "$RUNNER_TEMP/out.json" --stderr "$RUNNER_TEMP/err.txt" \
            "$RUNNER_TEMP/Faradia.app" --args "$RUNNER_TEMP/test.wav" en-US,es-ES
          echo "out: $(cat "$RUNNER_TEMP/out.json")"
          echo "err: $(cat "$RUNNER_TEMP/err.txt")"
          # The runner has no one to grant permission: "denied" is the expected answer, but there must be one.
          grep -q '^{"' "$RUNNER_TEMP/out.json" || { echo "::error::no JSON answer"; exit 1; }
      - name: Keep the helper (for a publish made by hand)
        uses: actions/upload-artifact@v4
        with:
          name: faradia-app
          path: ${{ runner.temp }}/Faradia.app
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
