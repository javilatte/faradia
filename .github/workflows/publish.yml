name: Publish to npm

# Publishes the package to npm with Trusted Publishing (OIDC): no npm token is
# stored anywhere, and npm attaches a provenance attestation automatically.
# npmjs.com must list this repository and this workflow file (publish.yml) as
# the package's trusted publisher.
#
# Runs when a GitHub release is published, or by hand for an existing tag:
#   gh workflow run publish.yml -f tag=v2.0.0

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.0.0)'
        required: true

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  # macOS's speech recognition helper for dictation, built here so it ships inside the package and
  # no user (or maintainer) has to compile it.
  apple-voice:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      - run: scripts/build-apple-voice.sh
      - uses: actions/upload-artifact@v4
        with:
          name: faradia-transcribe
          path: server/voice/apple/bin/faradia-transcribe
          retention-days: 1

  publish:
    needs: apple-voice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: faradia-transcribe
          path: server/voice/apple/bin
      # Artifacts lose the executable bit.
      - run: chmod 755 server/voice/apple/bin/faradia-transcribe

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (bats)
        run: npm run test:bats

      - name: Show the package contents
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q 'server/voice/apple/bin/faradia-transcribe' pack.txt \
            || { echo "::error::the macOS dictation helper is not in the package"; exit 1; }

      - name: Publish
        run: npm publish --access public
